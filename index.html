    // =========================================================================
    // UTILITAS UMUM, TOAST, MODAL, & PERHITUNGAN NILAI
    // =========================================================================
    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const el = document.createElement('div');
      const colors = {
        success: 'bg-emerald-800 text-white border-emerald-600',
        error: 'bg-rose-700 text-white border-rose-500',
        info: 'bg-slate-800 text-white border-slate-600'
      };
      el.className = `pointer-events-auto px-4 py-3 rounded-xl shadow-lg border text-sm font-medium flex items-center justify-between gap-3 transition-all duration-300 ${colors[type] || colors.info}`;
      el.innerHTML = `<span>${message}</span><button onclick="this.parentElement.remove()" class="text-white/80 hover:text-white font-bold">&times;</button>`;
      container.appendChild(el);
      setTimeout(() => {
        if (el.parentElement) el.remove();
      }, 3800);
    }

    function openModal(htmlContent) {
      const backdrop = document.getElementById('modal-backdrop');
      const box = document.getElementById('modal-box');
      if (!backdrop || !box) return;
      box.innerHTML = htmlContent;
      backdrop.classList.remove('hidden');
      backdrop.classList.add('flex');
      if (window.lucide) lucide.createIcons();
    }

    window.closeModal = function () {
      const backdrop = document.getElementById('modal-backdrop');
      if (!backdrop) return;
      backdrop.classList.add('hidden');
      backdrop.classList.remove('flex');
    };

    function hitungNilaiAkhir(nh1, nh2, nh3, nh4, nu) {
      const jmlNH = Number(state.settings.jumlahNH) || 4;
      const bNH = (Number(state.settings.bobotNH) || 60) / 100;
      const bNU = (Number(state.settings.bobotNU) || 40) / 100;
      const nhArr = [Number(nh1) || 0, Number(nh2) || 0, Number(nh3) || 0, Number(nh4) || 0].slice(0, jmlNH);
      const rataNH = nhArr.reduce((acc, v) => acc + v, 0) / jmlNH;
      const akhir = rataNH * bNH + (Number(nu) || 0) * bNU;
      return Math.round(akhir * 10) / 10;
    }

    async function logAudit(aksi, detail) {
      const entry = {
        timestamp: new Date().toLocaleString('id-ID'),
        user: state.currentUser ? state.currentUser.nama : 'Sistem',
        role: state.currentUser ? state.currentUser.role : 'system',
        aksi,
        detail
      };
      if (IS_PREVIEW) {

      } else if (fbDb) {
        try {
          await addDoc(collection(fbDb, 'audit_logs'), entry);
        } catch (e) {
          console.error('Audit log error:', e);
        }
      }
    }

    // =========================================================================
    // SINKRONISASI FIRESTORE REAL-TIME (HANYA SAAT IS_PREVIEW === false)
    // =========================================================================
    function clearFirestoreSync() {
      state.unsubscribers.forEach(unsub => {
        if (typeof unsub === 'function') unsub();
      });
      state.unsubscribers = [];
    }

    function startFirestoreSync() {
      if (IS_PREVIEW || !fbDb) return;
      clearFirestoreSync();

      const bindCol = (colName, stateKey) => {
        const unsub = onSnapshot(collection(fbDb, colName), (snap) => {
          state[stateKey] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
          renderApp();
        }, (err) => console.error(`Sync ${colName} error:`, err));
        state.unsubscribers.push(unsub);
      };

      const unsubSettings = onSnapshot(doc(fbDb, 'settings_pondok', 'profil'), (docSnap) => {
        if (docSnap.exists()) {
          state.settings = { ...defaultSettings, ...docSnap.data() };
        } else {
          state.settings = { ...defaultSettings };
        }
        renderApp();
      });
      state.unsubscribers.push(unsubSettings);

      bindCol('users_portal', 'usersPortal');
      bindCol('santri', 'santri');
      bindCol('kelas', 'kelas');
      bindCol('mata_pelajaran', 'mataPelajaran');
      bindCol('penilaian', 'penilaian');
      bindCol('absensi_semester', 'absensiSemester');
      bindCol('evaluasi_raport', 'evaluasiRaport');
      bindCol('audit_logs', 'auditLogs');
    }

    // =========================================================================
    // OPERASI CRUD UNIFIED (IN-MEMORY SAAT PREVIEW, FIRESTORE SAAT PRODUKSI)
    // =========================================================================
    async function saveData(colName, stateKey, dataObj, docId = null) {
      if (IS_PREVIEW) {
        if (docId) {
          const idx = state[stateKey].findIndex(item => item.id === docId);
          if (idx > -1) state[stateKey][idx] = { ...state[stateKey][idx], ...dataObj };
          else state[stateKey].push({ id: docId, ...dataObj });
        } else {
          const newId = colName.slice(0, 2) + '_' + Date.now() + '_' + Math.floor(Math.random() * 100);
          state[stateKey].push({ id: newId, ...dataObj });
        }
        renderApp();
        return true;
      } else {
        if (!fbDb) return false;
        try {
          if (docId) {
            await setDoc(doc(fbDb, colName, docId), dataObj, { merge: true });
          } else {
            await addDoc(collection(fbDb, colName), dataObj);
          }
          return true;
        } catch (err) {
          showToast('Gagal menyimpan ke Firestore: ' + err.message, 'error');
          return false;
        }
      }
    }

    window.handleLoginSubmit = async function (e) {
      e.preventDefault();
      const form = e.target;

      if (state.loginTab === 'admin') {
        const email = form.email.value.trim();
        const password = form.password.value;

        if (IS_PREVIEW) {
          if (email === 'admin@pesantren.id' && password === 'admin123') {
            state.currentUser = {
              id: 'admin_demo',
              username: email,
              nama: 'Super Admin Pondok',
              role: 'super_admin',
              refId: ''
            };
            showToast('Berhasil masuk sebagai Super Admin (Mode Preview)');
            renderApp();
          } else {
            showToast('Email atau Password Admin demo salah!', 'error');
          }
          return;
        }

        try {
          const cred = await signInWithEmailAndPassword(fbAuth, email, password);
          state.currentUser = {
            id: cred.user.uid,
            username: cred.user.email,
            nama: cred.user.displayName || 'Administrator Pondok',
            role: 'super_admin',
            refId: ''
          };
          startFirestoreSync();
          await logAudit('Login Admin', `Admin ${email} masuk ke sistem`);
          showToast('Selamat datang, Administrator!');
          renderApp();
        } catch (err) {
          showToast('Autentikasi Firebase gagal: ' + err.message, 'error');
        }
      } else {
        const username = form.username.value.trim();
        const password = form.password.value;

        if (IS_PREVIEW) {
          const found = state.usersPortal.find(u => u.username === username && u.password === password && u.statusAktif);
          if (found) {
            state.currentUser = { ...found };
            if (found.role === 'wali') state.activeMenu = 'cetak_raport';
            showToast(`Selamat datang, ${found.nama}`);
            renderApp();
          } else {
            showToast('Username/NIS atau Password tidak ditemukan!', 'error');
          }
          return;
        }

        if (!fbDb) {
          showToast('Koneksi database Firebase belum dikonfigurasi.', 'error');
          return;
        }

        try {
          const q = query(
            collection(fbDb, 'users_portal'),
            where('username', '==', username),
            where('password', '==', password)
          );
          const snap = await getDocs(q);
          if (snap.empty) {
            showToast('Username/NIS atau Password tidak valid atau akun belum didaftarkan Admin.', 'error');
            return;
          }
          const userDoc = snap.docs[0];
          const userData = userDoc.data();
          if (userData.statusAktif === false) {
            showToast('Akun Anda dinonaktifkan oleh Administrator.', 'error');
            return;
          }
          state.currentUser = { id: userDoc.id, ...userData };
          if (userData.role === 'wali') state.activeMenu = 'cetak_raport';
          startFirestoreSync();
          await logAudit('Login Portal', `${userData.nama} (${userData.role}) masuk ke portal`);
          showToast(`Selamat datang, ${userData.nama}`);
          renderApp();
        } catch (err) {
          showToast('Gagal memverifikasi akun portal: ' + err.message, 'error');
        }
      }
    };

        const ws = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(ws);
        let imported = 0;

        for (const r of rows) {

          const payload = {
            nis: String(r.NIS).trim(),
            nama: String(r.Nama_Santri).trim(),

            kelasDiniyahId: findKelasId('Diniyah', r.Kelas_Diniyah),

        if (progFilter === 'Bahasa Arab') {
          return kelasFilter === 'all' ? Boolean(s.kelasArabId) : s.kelasArabId === kelasFilter;
        }
        return true;
      });

    let chartNilaiInstance = null;
    let chartAbsensiInstance = null;

    function initDashboardCharts() {
      if (typeof Chart === 'undefined') return;
      const ctxNilai = document.getElementById('chart-nilai-mapel');
      const ctxAbsen = document.getElementById('chart-rekap-absensi');

      if (ctxNilai) {
        if (chartNilaiInstance) chartNilaiInstance.destroy();
        const activeMapel = state.mataPelajaran.filter(m => m.statusAktif);
        const labels = activeMapel.map(m => m.namaMapel.length > 18 ? m.namaMapel.slice(0, 18) + '…' : m.namaMapel);
        const avgData = activeMapel.map(m => {
          const vals = state.penilaian.filter(p =>
            p.mapelId === m.id &&
            p.tahunAjaran === state.settings.tahunAjaranAktif &&
            p.semester === state.settings.semesterAktif
          ).map(p => Number(p.nilaiAkhir) || 0);
          if (!vals.length) return 0;
          return Math.round((vals.reduce((a, b) => a + b, 0) / vals.length) * 10) / 10;
        });
        const kkmData = activeMapel.map(m => Number(m.kkm) || 75);

        chartNilaiInstance = new Chart(ctxNilai, {
          type: 'bar',
          data: {
            labels: labels.length ? labels : ['Belum ada mapel'],
            datasets: [
              {
                label: 'Rata-rata Nilai Akhir',
                data: avgData.length ? avgData : [0],
                backgroundColor: '#059669',
                borderRadius: 6
              },
              {
                label: 'Standar KKM',
                data: kkmData.length ? kkmData : [75],
                backgroundColor: '#cbd5e1',
                borderRadius: 6
              }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: { y: { beginAtZero: true, max: 100 } }
          }
        });
      }

      if (ctxAbsen) {
        if (chartAbsensiInstance) chartAbsensiInstance.destroy();
        let totHadir = 0, totIzin = 0, totSakit = 0, totAlpa = 0;
        state.absensiSemester
          .filter(a => a.tahunAjaran === state.settings.tahunAjaranAktif && a.semester === state.settings.semesterAktif)
          .forEach(a => {
            ['jamaah', 'quran', 'arab', 'diniyah'].forEach(cat => {
              totHadir += Number(a[cat]?.hadir) || 0;
              totIzin += Number(a[cat]?.izin) || 0;
              totSakit += Number(a[cat]?.sakit) || 0;
              totAlpa += Number(a[cat]?.alpa) || 0;
            });
          });

        chartAbsensiInstance = new Chart(ctxAbsen, {
          type: 'doughnut',
          data: {
            labels: ['Hadir', 'Izin', 'Sakit', 'Alpa'],
            datasets: [{
              data: (totHadir + totIzin + totSakit + totAlpa) > 0 ? [totHadir, totIzin, totSakit, totAlpa] : [1, 0, 0, 0],
              backgroundColor: ['#059669', '#0284c7', '#f59e0b', '#e11d48'],
              borderWidth: 2
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { position: 'bottom' } }
          }
        });
      }
    }

    window.savePondokSettings = async function (e) {
      e.preventDefault();
      const f = e.target;
      const bNH = Number(f.bobotNH.value) || 0;
      const bNU = Number(f.bobotNU.value) || 0;
      if (bNH + bNU !== 100) {
        return showToast('Total Bobot NH + Bobot NU harus sama dengan 100%!', 'error');
      }
      const updated = {
        namaPondok: f.namaPondok.value.trim(),
        alamatPondok: f.alamatPondok.value.trim(),
        tahunBerdiri: f.tahunBerdiri.value.trim(),
        namaPengasuh: f.namaPengasuh.value.trim(),
        identitasLembaga: f.identitasLembaga.value.trim(),
        logoUrl: f.logoUrl.value.trim(),
        tahunAjaranAktif: f.tahunAjaranAktif.value.trim(),
        semesterAktif: f.semesterAktif.value,
        tanggalRaport: f.tanggalRaport.value,
        isLocked: f.isLocked.checked,
        jumlahNH: Number(f.jumlahNH.value) || 4,
        bobotNH: bNH,
        bobotNU: bNU
      };
      if (IS_PREVIEW) {
        state.settings = updated;
        renderApp();
      } else if (fbDb) {
        await setDoc(doc(fbDb, 'settings_pondok', 'profil'), updated, { merge: true });
      }
      await logAudit('Update Pengaturan Pondok', 'Memperbarui profil pondok & konfigurasi nilai');
      showToast('Identitas Pondok & Konfigurasi Raport berhasil disimpan');
    };

    window.saveBatchNilai = async function () {
      if (state.settings.isLocked) return showToast('Raport sedang dikunci!', 'error');
      const mapel = state.mataPelajaran.find(m => m.id === state.selectedMapelId);
      if (!mapel) return showToast('Pilih mata pelajaran terlebih dahulu!', 'error');

      const rows = document.querySelectorAll('[data-nilai-santri-id]');
      let savedCount = 0;

      for (const row of rows) {
        const santriId = row.getAttribute('data-nilai-santri-id');
        const nh1 = Number(row.querySelector('[name="nh1"]')?.value) || 0;
        const nh2 = Number(row.querySelector('[name="nh2"]')?.value) || 0;
        const nh3 = Number(row.querySelector('[name="nh3"]')?.value) || 0;
        const nh4 = Number(row.querySelector('[name="nh4"]')?.value) || 0;
        const nu = Number(row.querySelector('[name="nu"]')?.value) || 0;
        const catatanGuru = row.querySelector('[name="catatanGuru"]')?.value.trim() || '';
        const nilaiAkhir = hitungNilaiAkhir(nh1, nh2, nh3, nh4, nu);

        const existing = state.penilaian.find(p =>
          p.santriId === santriId &&
          p.mapelId === mapel.id &&
          p.tahunAjaran === state.settings.tahunAjaranAktif &&
          p.semester === state.settings.semesterAktif
        );

        await saveData('penilaian', 'penilaian', {
          tahunAjaran: state.settings.tahunAjaranAktif,
          semester: state.settings.semesterAktif,
          santriId,
          mapelId: mapel.id,
          nh1, nh2, nh3, nh4, nu,
          nilaiAkhir,
          catatanGuru
        }, existing ? existing.id : null);
        savedCount++;
      }

      await logAudit('Simpan Nilai', `Menyimpan ${savedCount} nilai mapel ${mapel.namaMapel}`);
      showToast(`Berhasil menyimpan ${savedCount} nilai santri`);
    };

    window.saveBatchAbsensi = async function () {
      if (state.settings.isLocked) return showToast('Raport sedang dikunci!', 'error');
      const cards = document.querySelectorAll('[data-absensi-santri-id]');
      let count = 0;

      for (const card of cards) {
        const santriId = card.getAttribute('data-absensi-santri-id');
        const readCat = (prefix) => ({
          hadir: Number(card.querySelector(`[name="${prefix}_h"]`)?.value) || 0,
          izin: Number(card.querySelector(`[name="${prefix}_i"]`)?.value) || 0,
          sakit: Number(card.querySelector(`[name="${prefix}_s"]`)?.value) || 0,
          alpa: Number(card.querySelector(`[name="${prefix}_a"]`)?.value) || 0
        });

        const existing = state.absensiSemester.find(a =>
          a.santriId === santriId &&
          a.tahunAjaran === state.settings.tahunAjaranAktif &&
          a.semester === state.settings.semesterAktif
        );

        await saveData('absensi_semester', 'absensiSemester', {
          tahunAjaran: state.settings.tahunAjaranAktif,
          semester: state.settings.semesterAktif,
          santriId,
          jamaah: readCat('jamaah'),
          quran: readCat('quran'),
          arab: readCat('arab'),
          diniyah: readCat('diniyah')
        }, existing ? existing.id : null);
        count++;
      }
      await logAudit('Simpan Absensi', `Menyimpan rekap absensi ${count} santri`);
      showToast(`Rekap absensi ${count} santri berhasil disimpan`);
    };

    // =========================================================================
    // MODUL 6: CETAK RAPORT A4 PORTRAIT & UNDUH PDF
    // =========================================================================
    window.downloadRaportPdf = function (nis, namaSantri) {
      const element = document.getElementById('printable-raport-area');
      if (!element) return showToast('Area raport tidak ditemukan', 'error');
      if (typeof html2pdf === 'undefined') {
        return window.printRaportIsolated();
      }
      showToast('Menyiapkan file PDF ukuran A4...', 'info');
      const opt = {
        margin: [6, 8, 6, 8],
        filename: `Raport_${nis}_${namaSantri.replace(/[^a-zA-Z0-9]/g, '_')}.pdf`,
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2, useCORS: true },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };
      html2pdf().set(opt).from(element).save().then(() => {
        showToast('File PDF Raport berhasil diunduh');
      }).catch(() => {
        window.printRaportIsolated();
      });
    };

    window.printRaportIsolated = function () {
      const content = document.getElementById('printable-raport-area');
      if (!content) return;
      const printWin = window.open('', '_blank', 'width=850,height=1100');
      if (!printWin) {
        window.print();
        return;
      }

    window.addPortalUserSubmit = async function (e) {
      e.preventDefault();
      const f = e.target;
      const role = f.role.value;
      const username = f.username.value.trim();

      if (state.usersPortal.some(u => u.username.toLowerCase() === username.toLowerCase())) {
        return showToast('Username/NIS sudah digunakan oleh akun lain!', 'error');
      }

      const payload = {
        nama: f.nama.value.trim(),
        username,
        password: f.password.value.trim(),
        role,
        refId: role === 'wali' ? f.refId.value : '',
        statusAktif: true
      };

      await saveData('users_portal', 'usersPortal', payload);
      await logAudit('Tambah Akun Portal', `Membuat akun ${payload.role} untuk ${payload.nama} (${payload.username})`);
      showToast('Akun pengguna portal berhasil ditambahkan');
      f.reset();
    };

    window.togglePortalUserStatus = async function (userId) {
      const target = state.usersPortal.find(u => u.id === userId);
      if (!target) return;
      await saveData('users_portal', 'usersPortal', { statusAktif: !target.statusAktif }, userId);
      await logAudit('Ubah Status Akun', `Mengubah status aktif akun ${target.username}`);
      showToast(`Status akun ${target.username} diperbarui`);
    };

    window.deletePortalUser = async function (userId) {
      const target = state.usersPortal.find(u => u.id === userId);
      await removeData('users_portal', 'usersPortal', userId);
      if (target) await logAudit('Hapus Akun Portal', `Menghapus akun ${target.username}`);
      showToast('Akun portal dihapus');
    };

    window.downloadFullBackupJson = async function () {
      const backupPayload = {
        appName: 'E-Raport Pondok Pesantren & Madrasah Diniyah',
        exportedAt: new Date().toISOString(),
        tahunAjaran: state.settings.tahunAjaranAktif,
        semester: state.settings.semesterAktif,
        data: {
          settings: state.settings,
          kelas: state.kelas,
          mataPelajaran: state.mataPelajaran,
          santri: state.santri,
          penilaian: state.penilaian,
          absensiSemester: state.absensiSemester,
          evaluasiRaport: state.evaluasiRaport,
          usersPortal: state.usersPortal,
          auditLogs: state.auditLogs
        }
      };
      const blob = new Blob([JSON.stringify(backupPayload, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const dateStr = new Date().toISOString().slice(0, 10);
      a.href = url;
      a.download = `Backup_Lengkap_ERaport_${dateStr}.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      await logAudit('Backup Data', 'Mengunduh file backup lengkap JSON');
      showToast('File Backup JSON seluruh data berhasil diunduh');
    };

    window.handleRestoreJsonFile = async function (event) {
      const file = event.target.files[0];

      try {
        const text = await file.text();
        const parsed = JSON.parse(text);
        if (!parsed || !parsed.data || !Array.isArray(parsed.data.santri)) {
          throw new Error('Format file backup JSON tidak valid.');

        const d = parsed.data;
        openModal(`

              <h3 class="text-base font-extrabold text-slate-900">Konfirmasi Restore Database</h3>

              <div>• Kelas: <strong>${d.kelas?.length || 0}</strong> | Mata Pelajaran: <strong>${d.mataPelajaran?.length || 0}</strong> | Santri: <strong>${d.santri?.length || 0}</strong></div>
              <div>• Nilai: <strong>${d.penilaian?.length || 0}</strong> | Absensi: <strong>${d.absensiSemester?.length || 0}</strong> | Evaluasi Pengasuh: <strong>${d.evaluasiRaport?.length || 0}</strong></div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 pt-1">
              <button type="button" id="btn-restore-merge" class="p-3 rounded-xl bg-emerald-800 hover:bg-emerald-900 text-white text-left">
                <div class="text-xs font-extrabold">Gabung & Perbarui (Merge)</div>
                <div class="text-[11px] text-emerald-200">Menambahkan/memperbarui data tanpa menghapus data lama yang tidak bentrok.</div>
              </button>
              <button type="button" id="btn-restore-replace" class="p-3 rounded-xl bg-amber-600 hover:bg-amber-700 text-white text-left">
                <div class="text-xs font-extrabold">Timpa Total (Replace)</div>
                <div class="text-[11px] text-amber-100">Mengganti seluruh data saat ini agar persis sama dengan isi file backup.</div>
              </button>
            </div>
          </div>
        `);

        window._pendingRestoreData = d;
        setTimeout(() => {
          document.getElementById('btn-restore-merge')?.addEventListener('click', () => executeRestoreData('merge'));
          document.getElementById('btn-restore-replace')?.addEventListener('click', () => executeRestoreData('replace'));
        }, 50);
      } catch (err) {
        showToast('Gagal membaca file backup: ' + err.message, 'error');
      } finally {
        event.target.value = '';
      }
    };

    async function executeRestoreData(mode) {
      const d = window._pendingRestoreData;
      if (!d) return;
      closeModal();
      showToast('Memproses pemulihan data...', 'info');

      const collectionsMap = [
        { col: 'kelas', key: 'kelas' },
        { col: 'mata_pelajaran', key: 'mataPelajaran' },
        { col: 'santri', key: 'santri' },
        { col: 'penilaian', key: 'penilaian' },
        { col: 'absensi_semester', key: 'absensiSemester' },
        { col: 'evaluasi_raport', key: 'evaluasiRaport' },
        { col: 'users_portal', key: 'usersPortal' }
      ];

      if (IS_PREVIEW) {
        if (d.settings) state.settings = { ...defaultSettings, ...d.settings };
        for (const cfg of collectionsMap) {
          const incoming = Array.isArray(d[cfg.key]) ? d[cfg.key] : [];
          if (mode === 'replace') {
            state[cfg.key] = incoming;
          } else {
            const map = new Map(state[cfg.key].map(i => [i.id, i]));
            incoming.forEach(item => map.set(item.id || ('r_' + Math.random()), item));
            state[cfg.key] = Array.from(map.values());
          }
        }
        renderApp();
      } else if (fbDb) {
        if (d.settings) {
          await setDoc(doc(fbDb, 'settings_pondok', 'profil'), d.settings, { merge: mode === 'merge' });
        }
        for (const cfg of collectionsMap) {
          if (mode === 'replace') {
            for (const oldItem of state[cfg.key]) {
              await deleteDoc(doc(fbDb, cfg.col, oldItem.id));
            }
          }
          const incoming = Array.isArray(d[cfg.key]) ? d[cfg.key] : [];
          for (const item of incoming) {
            const { id, ...cleanObj } = item;
            if (id) await setDoc(doc(fbDb, cfg.col, id), cleanObj, { merge: true });
            else await addDoc(collection(fbDb, cfg.col), cleanObj);
          }
        }
      }

      window._pendingRestoreData = null;
      await logAudit('Restore Data', `Memulihkan database menggunakan mode ${mode.toUpperCase()}`);
      showToast(`Pemulihan data (${mode.toUpperCase()}) berhasil selesai!`);
    }

      }

      const menus = getMenusForRole(state.currentUser.role);
      if (!menus.some(m => m.id === state.activeMenu)) {
        state.activeMenu = menus[0]?.id || 'dashboard';
      }

      let contentHtml = '';
      if (state.activeMenu === 'dashboard') contentHtml = renderDashboard();
      else if (state.activeMenu === 'master') contentHtml = renderMasterModule();
      else if (state.activeMenu === 'penilaian') contentHtml = renderPenilaianModule();
      else if (state.activeMenu === 'absensi') contentHtml = renderAbsensiModule();
      else if (state.activeMenu === 'evaluasi') contentHtml = renderEvaluasiModule();
      else if (state.activeMenu === 'cetak_raport') contentHtml = renderCetakRaportModule();
      else if (state.activeMenu === 'manajemen_data') contentHtml = renderManajemenDataModule();
      else if (state.activeMenu === 'pengguna') contentHtml = renderPenggunaModule();

      root.innerHTML = `
        <div class="min-h-screen flex flex-col md:flex-row">
          <!-- DESKTOP FIXED SIDEBAR -->
          <aside class="hidden md:flex md:w-64 md:flex-col md:fixed md:inset-y-0 bg-emerald-950 text-white z-30 no-print">
            <div class="p-5 border-b border-emerald-900 flex items-center gap-3">
              <div class="w-10 h-10 rounded-xl bg-emerald-700 flex items-center justify-center shrink-0">
                <i data-lucide="book-open-check" class="w-5 h-5 text-white"></i>
              </div>
              <div class="overflow-hidden">
                <div class="font-extrabold text-sm tracking-tight truncate">E-RAPORT PONDOK</div>
                <div class="text-[11px] text-emerald-300 truncate">${state.settings.semesterAktif} ${state.settings.tahunAjaranAktif}</div>
              </div>
            </div>

            ${IS_PREVIEW ? `
              <div class="mx-4 mt-3 px-3 py-1.5 rounded-lg bg-amber-500/20 border border-amber-400/30 text-amber-200 text-[10px] font-bold text-center">
                MODE PREVIEW (DEMO)
              </div>
            ` : ''}

            <nav class="flex-1 px-3 py-4 space-y-1 overflow-y-auto">
              ${menus.map(m => `
                <button type="button" onclick="navigateMenu('${m.id}')" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-bold transition ${
                  state.activeMenu === m.id
                    ? 'bg-emerald-700 text-white shadow-md'
                    : 'text-emerald-200 hover:bg-emerald-900/70 hover:text-white'
                }">
                  <i data-lucide="${m.icon}" class="w-4 h-4 shrink-0"></i>
                  <span>${m.label}</span>
                </button>
              `).join('')}
            </nav>

            <div class="p-4 border-t border-emerald-900 space-y-3">
              <div class="flex items-center gap-2.5">
                <div class="w-8 h-8 rounded-full bg-emerald-800 flex items-center justify-center font-bold text-xs uppercase shrink-0">
                  ${state.currentUser.nama.charAt(0)}
                </div>
                <div class="overflow-hidden">
                  <div class="text-xs font-bold truncate">${state.currentUser.nama}</div>
                  <div class="text-[10px] text-emerald-300 uppercase">${state.currentUser.role.replace('_', ' ')}</div>
                </div>
              </div>
              <button type="button" onclick="handleLogout()" class="w-full py-2 rounded-xl bg-rose-600/20 hover:bg-rose-600 text-rose-200 hover:text-white text-xs font-bold transition flex items-center justify-center gap-1.5">
                <i data-lucide="log-out" class="w-3.5 h-3.5"></i> Keluar Aplikasi
              </button>
            </div>
          </aside>

          <!-- MOBILE TOP HEADER -->
          <header class="md:hidden glass-nav sticky top-0 z-30 border-b border-slate-200 px-3.5 py-2.5 flex items-center justify-between gap-2 no-print">
            <div class="flex items-center gap-2.5 min-w-0">
              <button type="button" onclick="toggleMobileDrawer(true)" aria-label="Buka Menu Navigasi"
                class="w-9 h-9 rounded-xl bg-emerald-800 hover:bg-emerald-900 text-white flex items-center justify-center shrink-0 shadow-xs active:scale-95 transition">
                <i data-lucide="menu" class="w-5 h-5"></i>
              </button>
              <div class="min-w-0">
                <div class="font-extrabold text-xs text-slate-900 truncate">E-RAPORT PESANTREN</div>
                <div class="text-[10px] text-emerald-700 font-bold truncate">${menus.find(m => m.id === state.activeMenu)?.label || 'Dashboard'} • ${state.currentUser.nama}</div>
              </div>
            </div>
            <button type="button" onclick="handleLogout()" class="px-2.5 py-1.5 rounded-xl bg-rose-50 text-rose-700 text-[11px] font-bold shrink-0">
              Keluar
            </button>
          </header>

          <!-- MOBILE SLIDE-OVER DRAWER (MENAMPILKAN SELURUH MODUL SIDEBAR DI HP) -->
          ${state.mobileDrawerOpen ? `
            <div class="md:hidden fixed inset-0 z-50 flex no-print">
              <div onclick="toggleMobileDrawer(false)" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs"></div>
              <aside class="relative w-72 max-w-[82vw] bg-emerald-950 text-white h-full flex flex-col shadow-2xl z-10">
                <div class="p-4 border-b border-emerald-900 flex items-center justify-between gap-2">
                  <div class="flex items-center gap-2.5 min-w-0">
                    <div class="w-9 h-9 rounded-xl bg-emerald-700 flex items-center justify-center shrink-0">
                      <i data-lucide="book-open-check" class="w-5 h-5 text-white"></i>
                    </div>
                    <div class="overflow-hidden">
                      <div class="font-extrabold text-xs tracking-tight truncate">E-RAPORT PONDOK</div>
                      <div class="text-[10px] text-emerald-300 truncate">${state.settings.semesterAktif} ${state.settings.tahunAjaranAktif}</div>
                    </div>
                  </div>
                  <button type="button" onclick="toggleMobileDrawer(false)" class="w-8 h-8 rounded-lg bg-emerald-900/80 text-emerald-200 flex items-center justify-center">
                    <i data-lucide="x" class="w-4 h-4"></i>
                  </button>
                </div>

                ${IS_PREVIEW ? `
                  <div class="mx-3 mt-3 px-3 py-1.5 rounded-lg bg-amber-500/20 border border-amber-400/30 text-amber-200 text-[10px] font-bold text-center">
                    MODE PREVIEW (DEMO)
                  </div>
                ` : ''}

                <nav class="flex-1 px-3 py-3 space-y-1 overflow-y-auto">
                  ${menus.map(m => `
                    <button type="button" onclick="navigateMenu('${m.id}')" class="w-full flex items-center gap-3 px-3.5 py-3 rounded-xl text-xs font-bold transition ${
                      state.activeMenu === m.id
                        ? 'bg-emerald-700 text-white shadow-md'
                        : 'text-emerald-200 hover:bg-emerald-900/70 hover:text-white'
                    }">
                      <i data-lucide="${m.icon}" class="w-4 h-4 shrink-0"></i>
                      <span>${m.label}</span>
                    </button>
                  `).join('')}
                </nav>

                <div class="p-4 border-t border-emerald-900 space-y-3">
                  <div class="flex items-center gap-2.5">
                    <div class="w-8 h-8 rounded-full bg-emerald-800 flex items-center justify-center font-bold text-xs uppercase shrink-0">
                      ${state.currentUser.nama.charAt(0)}
                    </div>
                    <div class="overflow-hidden">
                      <div class="text-xs font-bold truncate">${state.currentUser.nama}</div>
                      <div class="text-[10px] text-emerald-300 uppercase">${state.currentUser.role.replace('_', ' ')}</div>
                    </div>
                  </div>
                  <button type="button" onclick="handleLogout()" class="w-full py-2.5 rounded-xl bg-rose-600/20 hover:bg-rose-600 text-rose-200 hover:text-white text-xs font-bold transition flex items-center justify-center gap-1.5">
                    <i data-lucide="log-out" class="w-3.5 h-3.5"></i> Keluar Aplikasi
                  </button>
                </div>
              </aside>
            </div>
          ` : ''}

          <!-- MAIN WORKSPACE -->
          <main class="flex-1 md:pl-64 pb-24 md:pb-10">
            <div class="max-w-7xl mx-auto p-4 md:p-7">
              ${contentHtml}
            </div>
          </main>

          <!-- MOBILE FLOATING BOTTOM NAVIGATION BAR (SCROLLABLE + TOMBOL SEMUA MENU) -->
          <nav class="md:hidden fixed bottom-2.5 inset-x-2.5 glass-nav border border-slate-200/90 shadow-xl rounded-2xl z-40 px-1.5 py-1.5 flex items-center gap-1 overflow-x-auto no-print">
            <button type="button" onclick="toggleMobileDrawer(true)" class="flex flex-col items-center justify-center py-1.5 px-2.5 rounded-xl text-emerald-900 bg-emerald-100/80 font-extrabold shrink-0">
              <i data-lucide="layout-grid" class="w-4 h-4 mb-0.5"></i>
              <span class="text-[10px] leading-tight">Menu</span>
            </button>
            ${menus.map(m => {
              const shortLabel = m.id === 'master' ? 'Master'
                : m.id === 'penilaian' ? 'Nilai'
                : m.id === 'absensi' ? 'Absensi'
                : m.id === 'evaluasi' ? 'Pengasuh'
                : m.id === 'cetak_raport' ? 'Raport'
                : m.id === 'manajemen_data' ? 'Backup'
                : m.id === 'pengguna' ? 'Akun'
                : 'Beranda';
              return `
                <button type="button" onclick="navigateMenu('${m.id}')" class="flex-1 min-w-[54px] flex flex-col items-center justify-center py-1.5 px-1.5 rounded-xl transition shrink-0 ${
                  state.activeMenu === m.id ? 'text-emerald-800 bg-emerald-50 font-extrabold' : 'text-slate-500 font-medium'
                }">
                  <i data-lucide="${m.icon}" class="w-4 h-4 mb-0.5"></i>
                  <span class="text-[10px] leading-tight whitespace-nowrap">${shortLabel}</span>
                </button>
              `;
            }).join('')}
          </nav>
        </div>
      `;

      if (window.lucide) lucide.createIcons();
      if (state.activeMenu === 'dashboard') {
        initDashboardCharts();
      }
    }
    window.renderApp = renderApp;

    // =========================================================================
    // BOOTSTRAP APLIKASI
    // =========================================================================
    renderApp(); // Render layar awal segera agar tidak pernah blank putih

    if (!IS_PREVIEW && fbAuth) {
      onAuthStateChanged(fbAuth, (user) => {
        if (user) {
          state.currentUser = {
            id: user.uid,
            username: user.email,
            nama: user.displayName || 'Administrator Pondok',
            role: 'super_admin',
            refId: ''
          };
          startFirestoreSync();
        }
        renderApp();
      });
    }
  </script>
</body>
</html>
